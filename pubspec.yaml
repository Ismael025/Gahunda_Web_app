name: gahunda
description: A personal planning, behavior, school, and money companion.
publish_to: "none"
version: 1.1.0+17

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  drift: ^2.26.1
  drift_flutter: ^0.2.5
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.0
  supabase_flutter: ^2.17.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: Gahunda
  publisher_display_name: Gahunda
  identity_name: Gahunda.PersonalCompanion
  msix_version: 1.1.0.0
  logo_path: assets/branding/gahunda_icon.png
  capabilities: internetClient
  protocol_activation: io.gahunda.app
